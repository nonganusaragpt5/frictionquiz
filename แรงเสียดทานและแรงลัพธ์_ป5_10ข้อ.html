<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แรงเสียดทานและแรงลัพธ์ ป.5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf4fb,#f8f5ff);font-family:Tahoma,sans-serif;color:#243247;line-height:1.65}.wrap{max-width:850px;margin:25px auto;padding:15px}.card{background:white;border-radius:20px;padding:25px;box-shadow:0 10px 30px #18315318}h1{color:#183153;margin:0;font-size:clamp(23px,4vw,32px)}.sub,.small{color:#64748b}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.pill{background:#eef6fc;color:#2878b9;border-radius:30px;padding:6px 12px}.track{height:10px;background:#e7edf3;border-radius:20px;margin:18px 0;overflow:hidden}.bar{height:100%;background:#2878b9;width:10%;transition:.2s}.question{font-size:19px;font-weight:bold;margin:20px 0 15px}.options{display:grid;gap:10px}.option{display:flex;gap:10px;border:1px solid #dce5ee;border-radius:12px;padding:12px;cursor:pointer}.option.selected,.option:hover{background:#eef6fc;border-color:#2878b9}input{accent-color:#2878b9;margin-top:6px}.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px}.good{display:block;background:#eaf7f0;border-left:5px solid #21865b}.bad{display:block;background:#fff0f0;border-left:5px solid #c74646}.controls{display:flex;justify-content:space-between;margin-top:22px;gap:10px}button{border:0;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:bold;cursor:pointer}.primary{background:#2878b9;color:white}.secondary{background:#e8eef5;color:#183153}button:disabled{opacity:.4}.score{font-size:48px;color:#2878b9;font-weight:bold;text-align:center}.result{text-align:center}.review{text-align:left;margin-top:20px}.review-item{padding:12px;border-bottom:1px solid #e6edf3}@media(max-width:560px){.wrap{padding:10px}.card{padding:18px}.question{font-size:17px}}
</style></head><body><div class="wrap"><main class="card">
<div class="top"><div><h1>🛞 แรงเสียดทานและแรงลัพธ์</h1><div class="sub">แบบทดสอบวิทยาศาสตร์ ชั้นประถมศึกษาปีที่ 5</div></div><span class="pill">10 ข้อ · 10 คะแนน</span></div>
<div class="track"><div class="bar" id="bar"></div></div><div class="top small"><span id="progress">ข้อ 1 จาก 10</span><span id="answered">ตอบแล้ว 0/10 ข้อ</span></div>
<section id="quiz"><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="secondary" id="prev">ย้อนกลับ</button><button class="primary" id="next">ตรวจคำตอบ</button></div></section><section id="result" class="result" hidden></section>
</main></div><script>
const Q=[
["แรงเสียดทานเกิดขึ้นเมื่อใด",["วัตถุสองผิวสัมผัสกันและมีการเคลื่อนที่หรือพยายามเคลื่อนที่สัมพัทธ์กัน","วัตถุไม่มีน้ำหนัก","มีแสงส่องผ่านวัตถุ","วัตถุอยู่ห่างกัน"],0,"แรงเสียดทานเกิดบริเวณผิวสัมผัส และต้านการเคลื่อนที่หรือแนวโน้มการเคลื่อนที่ระหว่างผิวสัมผัส"],
["ข้อใดเป็นประโยชน์ของแรงเสียดทาน",["ทำให้เครื่องจักรสึกหรอ","ช่วยให้พื้นรองเท้ายึดเกาะพื้นขณะเดิน","ทำให้ลากกล่องยากขึ้น","ทำให้เครื่องยนต์ร้อน"],1,"แรงเสียดทานระหว่างพื้นรองเท้ากับพื้นช่วยป้องกันการลื่นไถล ทำให้เดินได้"],
["หากต้องการลากกล่องให้เคลื่อนที่ง่ายขึ้น ควรทำอย่างไร",["เพิ่มความขรุขระของพื้น","โรยทรายบนพื้น","ใช้ลูกล้อรองใต้กล่อง","กดกล่องให้แน่นขึ้น"],2,"ลูกล้อช่วยให้เกิดการกลิ้งแทนการไถล จึงช่วยลดแรงต้านการเคลื่อนที่"],
["พื้นผิวคู่ใดมีแนวโน้มเกิดแรงเสียดทานมากกว่า เมื่อกดด้วยแรงใกล้เคียงกัน",["น้ำแข็งกับยางเรียบ","กระเบื้องเปียกกับรองเท้าเรียบ","พื้นหยาบกับพื้นรองเท้ามีดอกยาง","กระจกเรียบกับพลาสติกเรียบ"],2,"พื้นผิวขรุขระและยึดเกาะกันดีมักเกิดแรงเสียดทานมากกว่าพื้นผิวเรียบลื่น"],
["แรงลัพธ์หมายถึงข้อใด",["แรงที่มีค่ามากที่สุด","ผลรวมของแรงทั้งหมดที่กระทำต่อวัตถุ โดยคำนึงถึงทิศทาง","แรงเสียดทานเพียงแรงเดียว","แรงที่ทำให้วัตถุหยุดนิ่งเสมอ"],1,"แรงลัพธ์คือผลรวมของแรงที่กระทำต่อวัตถุ ต้องพิจารณาทั้งขนาดและทิศทาง"],
["เด็กสองคนผลักกล่องไปทางขวา คนแรก 5 นิวตัน คนที่สอง 3 นิวตัน แรงลัพธ์เท่าใด",["2 นิวตัน ไปทางขวา","8 นิวตัน ไปทางขวา","8 นิวตัน ไปทางซ้าย","15 นิวตัน ไปทางขวา"],1,"แรงทิศเดียวกันนำมาบวกกัน: 5 + 3 = 8 นิวตัน ไปทางขวา"],
["มีแรง 9 นิวตัน ผลักกล่องไปทางขวา และ 4 นิวตัน ผลักไปทางซ้าย แรงลัพธ์เป็นเท่าใด",["13 นิวตัน ไปทางขวา","13 นิวตัน ไปทางซ้าย","5 นิวตัน ไปทางขวา","5 นิวตัน ไปทางซ้าย"],2,"แรงทิศตรงข้ามนำขนาดมาลบกัน: 9 - 4 = 5 นิวตัน ไปทางแรงที่มากกว่า คือทางขวา"],
["วัตถุถูกดึงไปทางขวา 6 นิวตัน และซ้าย 6 นิวตัน แรงลัพธ์เท่าใด",["12 นิวตัน ไปทางขวา","6 นิวตัน ไปทางซ้าย","0 นิวตัน","12 นิวตัน ไปทางซ้าย"],2,"แรงขนาดเท่ากันแต่ทิศตรงข้ามหักล้างกัน แรงลัพธ์จึงเป็นศูนย์นิวตัน"],
["เมื่อแรงลัพธ์ที่กระทำต่อวัตถุไม่เป็นศูนย์ วัตถุจะเป็นอย่างไร",["ต้องหยุดนิ่งทันที","อาจเปลี่ยนความเร็วหรือทิศทางการเคลื่อนที่","ต้องเคลื่อนที่ด้วยความเร็วคงที่เสมอ","ไม่มีการเปลี่ยนแปลง"],1,"แรงลัพธ์ไม่เป็นศูนย์ทำให้การเคลื่อนที่เปลี่ยนแปลงได้ เช่น เร็วขึ้น ช้าลง หรือเปลี่ยนทิศทาง"],
["นักเรียนผลักโต๊ะไปทางขวา แต่โต๊ะยังไม่เคลื่อนที่ ข้อใดอธิบายได้เหมาะสมที่สุด",["ไม่มีแรงกระทำต่อโต๊ะ","แรงเสียดทานสถิตจากพื้นต้านแรงผลัก และอาจมีขนาดเท่ากัน","แรงโน้มถ่วงหายไป","โต๊ะไม่มีมวล"],1,"แรงเสียดทานสถิตสามารถต้านแรงผลัก ทำให้แรงลัพธ์เป็นศูนย์และโต๊ะยังอยู่นิ่ง"]
];
let n=0,A=Array(10).fill(null),C=Array(10).fill(false);const $=x=>document.getElementById(x),letters="กขคง";
function draw(){let q=Q[n];$("question").textContent=`${n+1}. ${q[0]}`;$("options").innerHTML="";q[1].forEach((v,i)=>{let l=document.createElement("label");l.className="option"+(A[n]===i?" selected":"");l.innerHTML=`<input type="radio" name="a" ${A[n]===i?"checked":""}><span>${letters[i]}. ${v}</span>`;l.querySelector("input").onchange=()=>{A[n]=i;draw()};$("options").appendChild(l)});$("progress").textContent=`ข้อ ${n+1} จาก 10`;$("answered").textContent=`ตอบแล้ว ${A.filter(x=>x!==null).length}/10 ข้อ`;$("bar").style.width=`${(n+1)*10}%`;$("prev").disabled=n===0;$("next").textContent=C[n]?(n===9?"ดูผลคะแนน":"ข้อต่อไป"):"ตรวจคำตอบ";let f=$("feedback");f.className="feedback";f.style.display="none";if(C[n]){let ok=A[n]===q[2];f.className="feedback "+(ok?"good":"bad");f.innerHTML=`<b>${ok?"✓ ถูกต้อง!":"✗ ยังไม่ถูกต้อง"}</b><br>คำตอบ: ${letters[q[2]]}. ${q[1][q[2]]}<br>${q[3]}`;f.style.display="block"}}
$("prev").onclick=()=>{if(n>0){n--;draw()}};$("next").onclick=()=>{if(!C[n]){if(A[n]===null){alert("กรุณาเลือกคำตอบก่อนครับ");return}C[n]=true;draw()}else if(n<9){n++;draw()}else finish()};
function finish(){let s=Q.reduce((t,q,i)=>t+(A[i]===q[2]?1:0),0);$("quiz").hidden=true;$("result").hidden=false;$("result").innerHTML=`<div class="small">ผลการทำแบบทดสอบ</div><div class="score">${s}/10</div><h2>${s>=8?"ยอดเยี่ยม! เข้าใจเรื่องแรงได้ดี":s>=5?"ทำได้ดีแล้ว ลองทบทวนอีกครั้งนะ":"ทบทวนคำอธิบายแล้วลองทำใหม่ได้เลย"}</h2><p>ตอบถูก ${s} ข้อ จากทั้งหมด 10 ข้อ</p><button class="primary" id="retry">ทำแบบทดสอบอีกครั้ง</button><div class="review"><h3>เฉลยและทบทวน</h3>${Q.map((q,i)=>`<div class="review-item"><b>${i+1}. ${letters[q[2]]}. ${q[1][q[2]]}</b><br><span class="small">${q[3]}</span></div>`).join("")}</div>`;$("retry").onclick=()=>{n=0;A=Array(10).fill(null);C=Array(10).fill(false);$("quiz").hidden=false;$("result").hidden=true;draw()}}
draw();
</script></body></html>
